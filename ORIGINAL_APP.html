<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Book a Call with Kevin Okacha · Episteme Ventures</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#00313C;--green:#00DE8F;--green-dim:rgba(0,222,143,0.12);
  --bg:#ffffff;--surface:#f8f8f6;--border:#e5e7eb;
  --text:#1a1a1a;--muted:#6b7280;--muted2:#9ca3af;
  --sans:'Barlow Condensed',sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:16px;line-height:1.5}
button,input,select,textarea{font-family:var(--sans)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)!important}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* LAYOUT */
.app{max-width:960px;margin:0 auto;padding:0}
.header{background:var(--teal);padding:20px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-brand{display:flex;align-items:center;gap:12px}
.header-logo{font-size:22px;font-weight:700;letter-spacing:.15em;color:var(--green)}
.header-name{font-size:14px;color:rgba(255,255,255,.6);letter-spacing:.1em;text-transform:uppercase}
.header-avail{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green);letter-spacing:.1em;text-transform:uppercase}
.avail-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
@keyframes pdot{0%,100%{opacity:1}50%{opacity:.3}}
.avail-dot{animation:pdot 2s ease infinite}

/* STEPS */
.steps{display:flex;align-items:center;padding:20px 28px;border-bottom:1px solid var(--border);background:var(--bg);gap:0}
.step{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);flex:1}
.step-num{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;transition:all .2s}
.step.act .step-num{background:var(--teal);border-color:var(--teal);color:#fff}
.step.act{color:var(--teal)}
.step.done .step-num{background:var(--green);border-color:var(--green);color:var(--teal)}
.step.done{color:var(--muted)}
.step-div{flex:1;height:1px;background:var(--border);margin:0 4px}
@media(max-width:500px){.step-label{display:none}}

/* MAIN */
.main{padding:28px;min-height:420px}
@media(max-width:480px){.main{padding:18px}}

/* SECTION TITLES */
.sec-title{font-size:22px;font-weight:700;letter-spacing:.08em;color:var(--teal);margin-bottom:6px}
.sec-sub{font-size:14px;color:var(--muted);margin-bottom:24px;font-weight:400}

/* MEETING TYPES */
.types-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.type-card{border:1.5px solid var(--border);padding:20px;cursor:pointer;transition:all .18s;position:relative}
.type-card:hover{border-color:var(--teal);background:rgba(0,49,60,.04)}
.type-card.sel{border-color:var(--green);background:var(--green-dim)}
.type-card.sel::after{content:'✓';position:absolute;top:10px;right:12px;font-size:14px;color:var(--teal);font-weight:700}
.type-icon{font-size:24px;margin-bottom:8px}
.type-name{font-size:16px;font-weight:600;color:var(--teal);margin-bottom:4px;letter-spacing:.04em}
.type-dur{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.type-desc{font-size:13px;color:var(--muted);margin-top:6px;font-weight:400;line-height:1.4}

/* CALENDAR */
.cal-wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:600px){.cal-wrap{grid-template-columns:1fr}}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-month{font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--teal)}
.cal-nav{background:none;border:1px solid var(--border);width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--teal);transition:all .15s}
.cal-nav:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day-label{font-size:11px;color:var(--muted2);letter-spacing:.08em;text-align:center;padding:4px 0;text-transform:uppercase}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border-radius:2px}
.cal-day:hover:not(.disabled):not(.empty){background:rgba(0,49,60,.1);color:var(--teal)}
.cal-day.sel{background:var(--teal);color:#fff}
.cal-day.today{font-weight:700;color:var(--green)}
.cal-day.disabled{color:var(--muted2);cursor:not-allowed;opacity:.4}
.cal-day.empty{cursor:default}
/* SLOTS */
.slots-title{font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--teal);margin-bottom:12px;text-transform:uppercase}
.slots-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:320px;overflow-y:auto}
.slot{border:1.5px solid var(--border);padding:10px 8px;text-align:center;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500;letter-spacing:.05em}
.slot:hover{border-color:var(--teal);color:var(--teal)}
.slot.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
.no-slots{font-size:13px;color:var(--muted);text-align:center;padding:24px;border:1px dashed var(--border)}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:500px){.form-grid{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--teal);text-transform:uppercase}
.form-input{border:1.5px solid var(--border);padding:10px 12px;font-size:14px;color:var(--text);transition:border-color .15s;background:var(--bg)}
.form-input::placeholder{color:var(--muted2)}
textarea.form-input{resize:vertical;min-height:80px}
/* Reminders */
.reminders{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.reminder-tog{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--muted)}
.tog-switch{width:36px;height:20px;border-radius:10px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0}
.tog-switch::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.reminder-tog.on .tog-switch{background:var(--teal)}
.reminder-tog.on .tog-switch::after{transform:translateX(16px)}

/* CONFIRM CARD */
.confirm-card{border:1px solid var(--border);padding:24px;margin-bottom:20px}
.confirm-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.confirm-icon{font-size:32px}
.confirm-type{font-size:18px;font-weight:700;color:var(--teal);letter-spacing:.05em}
.confirm-meta{font-size:13px;color:var(--muted);margin-top:4px}
.confirm-rows{display:flex;flex-direction:column;gap:10px}
.confirm-row{display:flex;align-items:flex-start;gap:10px;font-size:14px}
.confirm-row-label{color:var(--muted);min-width:80px;flex-shrink:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:1px}
.confirm-row-val{color:var(--text);font-weight:500}
.meet-link{color:var(--teal);text-decoration:underline;word-break:break-all}

/* BOOKING SUCCESS */
.success-wrap{text-align:center;padding:40px 20px}
.success-icon{font-size:56px;margin-bottom:16px}
.success-title{font-size:26px;font-weight:700;color:var(--teal);letter-spacing:.06em;margin-bottom:8px}
.success-sub{font-size:15px;color:var(--muted);max-width:420px;margin:0 auto 28px;line-height:1.5}
.success-meet{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--green-dim);border:1.5px solid var(--green);font-size:14px;font-weight:600;color:var(--teal);text-decoration:none;letter-spacing:.05em;margin-bottom:12px}
.success-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.action-btn{padding:9px 20px;border:1.5px solid var(--border);background:none;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--muted);transition:all .15s}
.action-btn:hover{border-color:var(--teal);color:var(--teal)}
.action-btn.danger:hover{border-color:#dc2626;color:#dc2626}

/* ANALYTICS */
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px}
.stat-card{border:1px solid var(--border);padding:16px 20px}
.stat-num{font-size:32px;font-weight:700;color:var(--teal);line-height:1}
.stat-label{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.chart-wrap{border:1px solid var(--border);padding:20px;margin-bottom:16px}
.chart-title{font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--teal);text-transform:uppercase;margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--muted);width:120px;flex-shrink:0;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.bar-track{flex:1;height:20px;background:var(--surface);position:relative}
.bar-fill{height:100%;background:var(--teal);transition:width .6s ease}
.bar-val{font-size:12px;color:var(--muted);min-width:24px;text-align:right}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto}
.tab{padding:12px 20px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover{color:var(--teal)}
.tab.act{color:var(--teal);border-bottom-color:var(--teal)}

/* ADMIN */
.avail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:20px}
.day-toggle{border:1.5px solid var(--border);padding:10px 8px;text-align:center;cursor:pointer;transition:all .15s}
.day-toggle:hover{border-color:var(--teal)}
.day-toggle.on{border-color:var(--green);background:var(--green-dim)}
.day-name{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--teal)}
.day-toggle.on .day-name{color:var(--teal)}
.time-row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.time-select{border:1px solid var(--border);padding:6px 10px;font-size:13px;color:var(--text);background:var(--bg);cursor:pointer}
.admin-section{margin-bottom:28px}
.admin-label{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}

/* BOOKINGS LIST */
.booking-list{display:flex;flex-direction:column;gap:8px}
.booking-item{border:1px solid var(--border);padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.booking-item.confirmed{border-left:3px solid var(--green)}
.booking-item.cancelled{opacity:.5;border-left:3px solid #dc2626}
.bk-name{font-size:15px;font-weight:600;color:var(--teal);letter-spacing:.04em}
.bk-meta{font-size:12px;color:var(--muted);margin-top:3px}
.bk-status{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px}
.bk-status.confirmed{background:var(--green-dim);color:var(--teal)}
.bk-status.cancelled{background:#fef2f2;color:#dc2626}
.bk-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bk-btn{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--muted);transition:all .15s}
.bk-btn:hover{border-color:var(--teal);color:var(--teal)}
.bk-btn.danger:hover{border-color:#dc2626;color:#dc2626}

/* BUTTONS */
.btn-primary{background:var(--teal);color:#fff;border:none;padding:12px 28px;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:opacity .15s;min-height:44px}
.btn-primary:hover:not(:disabled){opacity:.88}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:none;color:var(--teal);border:1.5px solid var(--teal);padding:11px 28px;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .15s;min-height:44px}
.btn-secondary:hover{background:var(--teal);color:#fff}
.btn-row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:24px}
.btn-row .btn-primary,.btn-row .btn-secondary{flex:1;min-width:120px}

/* TZ badge */
.tz-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);background:var(--surface);padding:4px 8px;border:1px solid var(--border);letter-spacing:.06em}

/* Loading */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
.spinner.dark{border:2px solid var(--border);border-top-color:var(--teal)}

/* Error */
.err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:10px 14px;font-size:13px;margin-top:12px}

/* Responsive */
@media(max-width:400px){.main{padding:14px}.steps{padding:14px}.header{padding:14px 16px}}
</style>
<meta property="og:title" content="Book a Call — Kevin Okacha">
<meta property="og:description" content="Schedule a Discovery Call, Strategy Session, Digital Audit, or Project Kickoff with Kevin Okacha at Episteme Ventures.">
<meta property="og:url" content="https://kevin-okacha-scheduler.vercel.app/">
<link rel="canonical" href="https://kevin-okacha-scheduler.vercel.app/">
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-brand">
      <div class="header-logo">K·O</div>
      <div>
        <div style="font-size:16px;font-weight:700;letter-spacing:.08em;color:#fff">Kevin Okacha</div>
        <div class="header-name">Episteme Ventures · Nairobi</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div class="header-avail"><div class="avail-dot"></div>Currently Available</div>
      <a href="https://episteme-digital.vercel.app/" style="font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:1px solid rgba(255,255,255,.15);padding:5px 10px;transition:color .2s" onmouseover="this.style.color='#00DE8F'" onmouseout="this.style.color='rgba(255,255,255,.5)'">← Episteme Ventures</a>
    </div>
  </div>

  <!-- STEPS -->
  <div class="steps" id="steps-bar">
    <div class="step act" id="step-1"><div class="step-num">1</div><span class="step-label">Meeting Type</span></div>
    <div class="step-div"></div>
    <div class="step" id="step-2"><div class="step-num">2</div><span class="step-label">Date & Time</span></div>
    <div class="step-div"></div>
    <div class="step" id="step-3"><div class="step-num">3</div><span class="step-label">Details</span></div>
    <div class="step-div"></div>
    <div class="step" id="step-4"><div class="step-num">4</div><span class="step-label">Confirm</span></div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main-content"></div>

</div>

<script>
/* ══ EMAILJS SETUP ══
  To enable real email sending:
  1. Sign up free at emailjs.com
  2. Add Gmail as a service → copy Service ID → replace 'service_episteme'
  3. Create two email templates:
     - template_booking_client (to client) with vars: {{client_name}}, {{meeting_type}}, {{meeting_date}}, {{meeting_time}}, {{meet_link}}, {{cancel_url}}, {{reschedule_url}}
     - template_booking_host (to you) with same vars + {{client_email}}, {{client_company}}, {{notes}}
  4. Copy your Public Key → replace 'YOUR_EMAILJS_PUBLIC_KEY'
  Until configured, bookings save locally and the meet link still works.
══ */

/* ══ DATA ══ */
const MEETING_TYPES=[
  {id:'discovery',icon:'🔍',name:'Discovery Call',dur:30,desc:'First conversation. We explore your goals, challenges, and where I can add the most value.',color:'#00313C'},
  {id:'strategy',icon:'🗺️',name:'Strategy Session',dur:60,desc:'Deep-dive into your digital roadmap. Comes with a written brief post-call.',color:'#00313C'},
  {id:'review',icon:'🔬',name:'Digital Audit',dur:45,desc:'Review of your current digital presence with actionable recommendations.',color:'#00313C'},
  {id:'project',icon:'🚀',name:'Project Kickoff',dur:60,desc:'Scoping and planning session for a new engagement.',color:'#00313C'},
];

const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

// Availability: Mon–Fri, 9am–5pm EAT (Africa/Nairobi)
const AVAIL_DAYS=[1,2,3,4,5]; // Mon=1..Fri=5
const SLOTS_START=9,SLOTS_END=17,SLOT_DUR=30; // 30-min slots

/* ══ STATE ══ */
let state={
  view:'booking', // 'booking' | 'admin'
  step:1,
  selectedType:null,
  selectedDate:null,
  selectedSlot:null,
  calYear:new Date().getFullYear(),
  calMonth:new Date().getMonth(),
  form:{name:'',email:'',company:'',notes:''},
  reminders:{h24:true,h1:false},
  bookings:[],
  loading:false,
  error:'',
  done:null,
  adminTab:'bookings', // 'bookings'|'availability'|'analytics'
  tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'Africa/Nairobi',
};

/* ══ HELPERS ══ */
function genId(){return 'ep-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)}
function genMeet(){
  // Use Google Meet's lookup URL — opens a real meeting room
  const chars='abcdefghijkmnopqrstuvwxyz';
  const seg=n=>Array.from({length:n},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  const code=seg(3)+'-'+seg(4)+'-'+seg(3);
  return 'https://meet.google.com/'+code;
}
function genToken(){return Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10)}
function fmtDate(d){return DAYS[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()}
function fmtShort(d){return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate()}
function slotEnd(slot,dur){
  const [h,m]=slot.split(':').map(Number);
  const end=new Date(2000,0,1,h,m+dur);
  return String(end.getHours()).padStart(2,'0')+':'+String(end.getMinutes()).padStart(2,'0');
}
function isBooked(date,slot){
  return state.bookings.some(b=>{
    if(b.status==='cancelled')return false;
    return b.date.toDateString()===date.toDateString()&&b.slot===slot;
  });
}
function getSlots(date){
  if(!date)return[];
  if(!AVAIL_DAYS.includes(date.getDay()))return[];
  const slots=[];
  for(let h=SLOTS_START;h<SLOTS_END;h++){
    for(let m=0;m<60;m+=SLOT_DUR){
      const slot=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      if(!isBooked(date,slot))slots.push(slot);
    }
  }
  return slots;
}
function updateSteps(){
  [1,2,3,4].forEach(n=>{
    const el=document.getElementById('step-'+n);
    if(!el)return;
    el.className='step'+(n===state.step?' act':n<state.step?' done':'');
  });
}

/* ══ RENDER ══ */
function render(){
  const mc=document.getElementById('main-content');
  if(!mc)return;

  // Admin view disabled for public booking page

  updateSteps();

  if(state.done){mc.innerHTML=renderSuccess();bindSuccess();return;}

  let content='';
  if(state.step===1)content=renderStep1();
  else if(state.step===2)content=renderStep2();
  else if(state.step===3)content=renderStep3();
  else if(state.step===4)content=renderStep4();

  mc.innerHTML=content;
  bindStep();
}

function setState(patch){
  Object.assign(state,patch);
  render();
}

/* ── STEP 1: Meeting Type ── */
function renderStep1(){
  return`<div class="sec-title">Choose a meeting type</div>
<div class="sec-sub">Select the type of conversation that best fits your needs.</div>
<div class="types-grid">${MEETING_TYPES.map(t=>`
  <div class="type-card${state.selectedType?.id===t.id?' sel':''}" data-id="${t.id}">
    <div class="type-icon">${t.icon}</div>
    <div class="type-name">${t.name}</div>
    <div class="type-dur">${t.dur} min</div>
    <div class="type-desc">${t.desc}</div>
  </div>`).join('')}
</div>
<div class="btn-row" style="justify-content:flex-end">
  <button class="btn-primary" id="next1" ${!state.selectedType?'disabled':''}>Continue →</button>
</div>`;
}

/* ── STEP 2: Date & Time ── */
function renderStep2(){
  const now=new Date();
  const first=new Date(state.calYear,state.calMonth,1);
  const startDay=first.getDay();
  const daysInMonth=new Date(state.calYear,state.calMonth+1,0).getDate();
  const slots=getSlots(state.selectedDate);

  let calDays='';
  DAYS.forEach(d=>{calDays+=`<div class="cal-day-label">${d[0]}</div>`});
  for(let i=0;i<startDay;i++)calDays+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const date=new Date(state.calYear,state.calMonth,d);
    const isPast=date<new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const isAvail=AVAIL_DAYS.includes(date.getDay())&&!isPast;
    const isSel=state.selectedDate?.toDateString()===date.toDateString();
    const isToday=date.toDateString()===now.toDateString();
    const cls=['cal-day',isSel?'sel':'',isToday&&!isSel?'today':'',!isAvail?'disabled':''].filter(Boolean).join(' ');
    calDays+=`<div class="${cls}" data-date="${state.calYear}-${state.calMonth}-${d}" ${!isAvail?'':''}>${d}</div>`;
  }

  const slotsHtml=!state.selectedDate
    ?`<div class="no-slots">← Select a date</div>`
    :slots.length===0
    ?`<div class="no-slots">No availability on this date</div>`
    :`<div class="slots-grid">${slots.map(s=>`<div class="slot${state.selectedSlot===s?' sel':''}" data-slot="${s}">${s}</div>`).join('')}</div>`;

  return`<div class="sec-title">Pick a date & time</div>
<div class="sec-sub" style="display:flex;align-items:center;gap:10px">
  <span>${state.selectedType.icon} ${state.selectedType.name} · ${state.selectedType.dur} min</span>
  <span class="tz-badge">🌍 ${state.tz}</span>
</div>
<div class="cal-wrap">
  <div>
    <div class="cal-header">
      <button class="cal-nav" id="cal-prev">‹</button>
      <div class="cal-month">${MONTHS[state.calMonth]} ${state.calYear}</div>
      <button class="cal-nav" id="cal-next">›</button>
    </div>
    <div class="cal-grid">${calDays}</div>
  </div>
  <div>
    <div class="slots-title">${state.selectedDate?fmtDate(state.selectedDate):'Available times'}</div>
    ${slotsHtml}
  </div>
</div>
<div class="btn-row">
  <button class="btn-secondary" id="back2">← Back</button>
  <button class="btn-primary" id="next2" ${!state.selectedDate||!state.selectedSlot?'disabled':''}>Continue →</button>
</div>`;
}

/* ── STEP 3: Details ── */
function renderStep3(){
  const r=state.reminders;
  return`<div class="sec-title">Your details</div>
<div class="sec-sub">We'll send a confirmation and meeting link to your email.</div>
<div class="form-grid">
  <div class="form-group">
    <label class="form-label">Full Name *</label>
    <input class="form-input" id="f-name" type="text" placeholder="Jane Mwangi" value="${state.form.name}" autocomplete="name">
  </div>
  <div class="form-group">
    <label class="form-label">Email *</label>
    <input class="form-input" id="f-email" type="email" placeholder="jane@company.com" value="${state.form.email}" autocomplete="email">
  </div>
  <div class="form-group">
    <label class="form-label">Company / Organisation</label>
    <input class="form-input" id="f-company" type="text" placeholder="Acme Ltd" value="${state.form.company}">
  </div>
  <div class="form-group">
    <label class="form-label">Email Reminders</label>
    <div class="reminders">
      <label class="reminder-tog${r.h24?' on':''}" id="tog-24">
        <div class="tog-switch"></div> 24h before
      </label>
      <label class="reminder-tog${r.h1?' on':''}" id="tog-1">
        <div class="tog-switch"></div> 1h before
      </label>
    </div>
  </div>
  <div class="form-group full">
    <label class="form-label">Notes / Agenda (optional)</label>
    <textarea class="form-input" id="f-notes" placeholder="What would you like to discuss?">${state.form.notes}</textarea>
  </div>
</div>
<div class="btn-row">
  <button class="btn-secondary" id="back3">← Back</button>
  <button class="btn-primary" id="next3">Review Booking →</button>

}

/* ── STEP 4: Confirm ── */
function renderStep4(){
  const t=state.selectedType,d=state.selectedDate,s=state.selectedSlot;
  const meetLink=genMeet();
  if(!state._meetLink)state._meetLink=meetLink;
  return`<div class="sec-title">Confirm your booking</div>
<div class="sec-sub">Review the details below before confirming.</div>
<div class="confirm-card">
  <div class="confirm-header">
    <div class="confirm-icon">${t.icon}</div>
    <div>
      <div class="confirm-type">${t.name}</div>
      <div class="confirm-meta">${t.dur} min · Kevin Okacha</div>
    </div>
  </div>
  <div class="confirm-rows">
    <div class="confirm-row"><div class="confirm-row-label">Date</div><div class="confirm-row-val">${fmtDate(d)}</div></div>
    <div class="confirm-row"><div class="confirm-row-label">Time</div><div class="confirm-row-val">${s} – ${slotEnd(s,t.dur)} (${state.tz})</div></div>
    <div class="confirm-row"><div class="confirm-row-label">Name</div><div class="confirm-row-val">${state.form.name}</div></div>
    <div class="confirm-row"><div class="confirm-row-label">Email</div><div class="confirm-row-val">${state.form.email}</div></div>
    ${state.form.company?`<div class="confirm-row"><div class="confirm-row-label">Company</div><div class="confirm-row-val">${state.form.company}</div></div>`:''}
    ${state.form.notes?`<div class="confirm-row"><div class="confirm-row-label">Notes</div><div class="confirm-row-val">${state.form.notes}</div></div>`:''}
    <div class="confirm-row"><div class="confirm-row-label">Meet Link</div><div class="confirm-row-val"><a class="meet-link" href="${state._meetLink}" target="_blank">${state._meetLink}</a></div></div>
  </div>
</div>
${state.error?`<div class="err">${state.error}</div>`:''}
<div class="btn-row">
  <button class="btn-secondary" id="back4" ${state.loading?'disabled':''}>← Back</button>
  <button class="btn-primary" id="confirm-btn" ${state.loading?'disabled':''}>
    ${state.loading?'<span class="spinner"></span> Booking...':'✓ Confirm Booking'}
  </button>
</div>`;
}

/* ── SUCCESS ── */
function renderSuccess(){
  const b=state.done;
  return`<div class="success-wrap">
  <div class="success-icon">🎉</div>
  <div class="success-title">You're booked!</div>
  <div class="success-sub">A confirmation has been sent to <strong>${b.email}</strong>. Your Google Meet link is ready below.</div>
  <div style="margin-bottom:16px">
    <a class="success-meet" href="${b.meetLink}" target="_blank" rel="noopener">🎥 Join Google Meet ↗</a>
  </div>
  <div style="background:var(--surface);border:1px solid var(--border);padding:16px 20px;text-align:left;max-width:400px;margin:0 auto 20px">
    <div style="font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px">Booking Summary</div>
    <div style="font-size:14px;font-weight:600;color:var(--teal)">${b.type.name}</div>
    <div style="font-size:13px;color:var(--muted);margin-top:4px">${fmtDate(b.date)} · ${b.slot} – ${slotEnd(b.slot,b.type.dur)}</div>
    <div style="font-size:13px;color:var(--muted);margin-top:2px">${b.type.dur} min · ${state.tz}</div>
  </div>
  <div class="success-actions">
    <a href="https://episteme-digital.vercel.app/" class="action-btn" style="border-color:#00313C;color:#00313C;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px">← Episteme Ventures</a>
    <button class="action-btn" onclick="setState({done:null,step:1,selectedType:null,selectedDate:null,selectedSlot:null,form:{name:'',email:'',company:'',notes:''},_meetLink:null})">Book Another</button>
    <button class="action-btn danger" onclick="cancelBooking(\'${b.id}\')">Cancel</button>
  </div>
</div>`;
}

/* ── ADMIN ── */
function renderAdmin(){
  const tabs=['bookings','availability','analytics'];
  const tabLabels={bookings:'Bookings',availability:'Availability',analytics:'Analytics'};
  let content='';
  if(state.adminTab==='bookings')content=renderAdminBookings();
  else if(state.adminTab==='availability')content=renderAdminAvail();
  else content=renderAdminAnalytics();

  return`<div class="sec-title">Admin Panel</div>
<div class="tabs">${tabs.map(t=>`<button class="tab${state.adminTab===t?' act':''}" data-tab="${t}">${tabLabels[t]}</button>`).join('')}</div>
${content}`;
}

function renderAdminBookings(){
  const bs=state.bookings;
  if(!bs.length)return`<div class="no-slots">No bookings yet.</div>`;
  return`<div class="booking-list">${[...bs].reverse().map(b=>`
  <div class="booking-item ${b.status}">
    <div>
      <div class="bk-name">${b.name} ${b.company?'· '+b.company:''}</div>
      <div class="bk-meta">${b.type.name} · ${fmtDate(b.date)} ${b.slot} · ${b.email}</div>
      <div class="bk-actions">
        ${b.status==='confirmed'?`<button class="bk-btn danger" onclick="cancelBooking('${b.id}')">Cancel</button>`:''}
        <a class="bk-btn" href="${b.meetLink}" target="_blank">Join Meet</a>
      </div>
    </div>
    <span class="bk-status ${b.status}">${b.status}</span>
  </div>`).join('')}
</div>`;
}

function renderAdminAvail(){
  return`<div class="admin-section">
  <div class="admin-label">Available Days</div>
  <div class="avail-grid">${DAYS.map((d,i)=>`<div class="day-toggle${AVAIL_DAYS.includes(i)?' on':''}">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</div>`).join('')}</div>
  <div class="admin-label">Working Hours (EAT)</div>
  <div class="time-row">
    <span style="font-size:13px;color:var(--muted)">From</span>
    <select class="time-select"><option>09:00</option><option>08:00</option><option>10:00</option></select>
    <span style="font-size:13px;color:var(--muted)">To</span>
    <select class="time-select"><option>17:00</option><option>16:00</option><option>18:00</option></select>
  </div>
</div>
<div class="admin-section">
  <div class="admin-label">Buffer Between Meetings</div>
  <div class="time-row">
    <select class="time-select"><option>0 min</option><option>15 min</option><option selected>30 min</option><option>60 min</option></select>
  </div>
</div>
<button class="btn-primary" style="margin-top:8px">Save Settings</button>`;
}

function renderAdminAnalytics(){
  const bs=state.bookings;
  const total=bs.length,confirmed=bs.filter(b=>b.status==='confirmed').length,cancelled=bs.filter(b=>b.status==='cancelled').length;
  const byType={};MEETING_TYPES.forEach(t=>{byType[t.name]=bs.filter(b=>b.type.id===t.id).length});
  const maxType=Math.max(1,...Object.values(byType));
  return`<div class="analytics-grid">
  <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total Bookings</div></div>
  <div class="stat-card"><div class="stat-num">${confirmed}</div><div class="stat-label">Confirmed</div></div>
  <div class="stat-card"><div class="stat-num">${cancelled}</div><div class="stat-label">Cancelled</div></div>
  <div class="stat-card"><div class="stat-num">${total?Math.round(confirmed/total*100):0}%</div><div class="stat-label">Confirm Rate</div></div>
</div>
<div class="chart-wrap">
  <div class="chart-title">By Meeting Type</div>
  ${MEETING_TYPES.map(t=>`<div class="bar-row">
    <div class="bar-label">${t.name}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${byType[t.name]/maxType*100}%"></div></div>
    <div class="bar-val">${byType[t.name]}</div>
  </div>`).join('')}
</div>
${total===0?`<div class="no-slots">Book some meetings to see analytics.</div>`:''}`;
}

/* ── BIND ── */
function bindSuccess(){
  // No bindings needed — links are native <a> tags
}
function bindStep(){
  // Step 1
  document.querySelectorAll('.type-card').forEach(el=>{
    el.addEventListener('click',()=>{
      const t=MEETING_TYPES.find(x=>x.id===el.dataset.id);
      setState({selectedType:t});
    });
  });
  document.getElementById('next1')?.addEventListener('click',()=>{if(state.selectedType)setState({step:2})});

  // Step 2
  document.querySelectorAll('.cal-day:not(.disabled):not(.empty)').forEach(el=>{
    el.addEventListener('click',()=>{
      const [y,m,d]=el.dataset.date.split('-').map(Number);
      setState({selectedDate:new Date(y,m,d),selectedSlot:null});
    });
  });
  document.querySelectorAll('.slot').forEach(el=>{
    el.addEventListener('click',()=>setState({selectedSlot:el.dataset.slot}));
  });
  document.getElementById('cal-prev')?.addEventListener('click',()=>{
    let m=state.calMonth-1,y=state.calYear;
    if(m<0){m=11;y--;}
    setState({calMonth:m,calYear:y});
  });
  document.getElementById('cal-next')?.addEventListener('click',()=>{
    let m=state.calMonth+1,y=state.calYear;
    if(m>11){m=0;y++;}
    setState({calMonth:m,calYear:y});
  });
  document.getElementById('back2')?.addEventListener('click',()=>setState({step:1}));
  document.getElementById('next2')?.addEventListener('click',()=>{if(state.selectedDate&&state.selectedSlot)setState({step:3})});

  // Step 3
  document.getElementById('back3')?.addEventListener('click',()=>setState({step:2}));
  document.getElementById('tog-24')?.addEventListener('click',()=>setState({reminders:{...state.reminders,h24:!state.reminders.h24}}));
  document.getElementById('tog-1')?.addEventListener('click',()=>setState({reminders:{...state.reminders,h1:!state.reminders.h1}}));
  document.getElementById('next3')?.addEventListener('click',()=>{
    const name=document.getElementById('f-name')?.value.trim();
    const email=document.getElementById('f-email')?.value.trim();
    if(!name||!email){alert('Please fill in your name and email.');return;}
    setState({step:4,form:{name,email,company:document.getElementById('f-company')?.value.trim()||'',notes:document.getElementById('f-notes')?.value.trim()||''}});
  });

  // Step 4
  document.getElementById('back4')?.addEventListener('click',()=>setState({step:3,error:'',_meetLink:null}));
  document.getElementById('confirm-btn')?.addEventListener('click',confirmBooking);
}

function bindAdmin(){
  document.querySelectorAll('.tab[data-tab]').forEach(el=>{
    el.addEventListener('click',()=>setState({adminTab:el.dataset.tab}));
  });
}

/* ── BOOKING ── */
async function confirmBooking(){
  if(state.loading)return;
  setState({loading:true,error:''});
  const t=state.selectedType,d=state.selectedDate,s=state.selectedSlot;
  const token=genToken();
  const meetLink=state._meetLink||genMeet();
  const booking={
    id:genId(),name:state.form.name,email:state.form.email,
    company:state.form.company,type:t,date:d,slot:s,
    status:'confirmed',meetLink,token,eventId:'ep-'+Date.now()
  };

  // Send emails via EmailJS
  try{
    await sendConfirmationEmails(booking);
  }catch(e){
    console.warn('Email send failed:',e);
  }

  setState({loading:false,bookings:[...state.bookings,booking],done:booking,error:''});
}

async function sendConfirmationEmails(b){
  const EMAILJS_SERVICE='service_79ud3st';
  const EMAILJS_TEMPLATE_CLIENT='template_ispw4rg';
  const EMAILJS_TEMPLATE_HOST='template_j5guxe6';
  const EMAILJS_KEY='LNvEOrfVqCiRdR5FG';

  const dateStr=fmtDate(b.date);
  const timeStr=`${b.slot} – ${slotEnd(b.slot,b.type.dur)} (${state.tz})`;
  const cancelUrl=`https://kevin-okacha-scheduler.vercel.app/?cancel=${b.token}`;
  const reschedUrl=`https://kevin-okacha-scheduler.vercel.app/?reschedule=${b.token}`;

  const params={
    client_name:b.name,
    client_email:b.email,
    client_company:b.company||'—',
    meeting_type:b.type.name,
    meeting_duration:b.type.dur+' min',
    meeting_date:dateStr,
    meeting_time:timeStr,
    meet_link:b.meetLink,
    notes:state.form.notes||'None',
    cancel_url:cancelUrl,
    reschedule_url:reschedUrl,
    host_name:'Kevin Okacha',
    host_email:'kev.okacha@gmail.com',
  };

  // Load EmailJS if not already loaded
  if(!window.emailjs){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js';
      s.onload=res;s.onerror=rej;
      document.head.appendChild(s);
    });
    window.emailjs.init({publicKey:EMAILJS_KEY});
  }

  // Send to client
  await window.emailjs.send(EMAILJS_SERVICE,EMAILJS_TEMPLATE_CLIENT,{...params,to_email:b.email});
  // Send notification to host
  await window.emailjs.send(EMAILJS_SERVICE,EMAILJS_TEMPLATE_HOST,{...params,to_email:'kev.okacha@gmail.com'});
}

function cancelBooking(id){
  if(!confirm('Cancel this booking?'))return;
  const updated=state.bookings.map(b=>b.id===id?{...b,status:'cancelled'}:b);
  const isDone=state.done?.id===id;
  setState({bookings:updated,done:isDone?null:state.done,step:isDone?1:state.step});
}

// Init
render();
</script>
</body>
</html>
